<style>
:root{--bg:#0a0a0b;--bg2:#0d120e;--bg3:#121a14;--line:rgba(255,255,255,.07);--line2:rgba(255,255,255,.13);--text:#e8f0e8;--muted:#7a857c;--g:#00ff41;--g2:#00b82e;--lime:#e8f55a;

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}

a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.app{position:relative;display:grid;grid-template-rows:auto auto 1fr;height:100vh;max-width:1400px;margin:0 auto;padding:0 20px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;border-bottom:1px solid var(--line)}
.logo{font:700 18px var(--mono);display:flex;align-items:center}.logo .u{color:var(--g)}
.cur{display:inline-block;width:.55em;height:1.05em;background:var(--g);margin-left:4px;box-shadow:0 0 10px rgba(0,255,65,.5);animation:bl 1.05s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.ttl{font:12px var(--mono);color:var(--muted);display:flex;align-items:center;gap:10px}.ttl b{color:var(--text);font-weight:500}
.pill{border:1px solid rgba(0,255,65,.35);color:var(--g);border-radius:999px;padding:3px 10px;font:11px var(--mono)}
.right{display:flex;align-items:center;gap:10px}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden}.lang button{color:var(--muted);font:500 12px var(--mono);padding:6px 12px}.lang button.on{background:var(--g);color:var(--bg)}
.back{font:12px var(--mono);color:var(--muted)}.back:hover{color:var(--g)}
.note{margin:14px 0;padding:10px 14px;border:1px dashed var(--line2);border-radius:10px;font:12px var(--mono);color:var(--muted)}.note b{color:var(--text);font-weight:500}
.main{display:grid;grid-template-columns:330px 1fr;gap:16px;min-height:0}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.left{padding:16px;gap:16px;overflow:auto}
.left h4{font:11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.src{border:1px solid var(--line2);border-radius:14px;overflow:hidden;background:var(--bg)}
.thumb{aspect-ratio:16/9;position:relative;background:radial-gradient(circle at 30% 40%,rgba(0,255,65,.18),transparent 55%),radial-gradient(circle at 75% 60%,rgba(0,184,46,.14),transparent 50%),#0f1611;display:grid;place-items:center}
.thumb .mics{display:flex;gap:40px}
.thumb .mics i{width:46px;height:62px;border-radius:24px 24px 14px 14px;background:linear-gradient(#26332a,#18211b);border:1px solid var(--line2)}
.thumb .dur{position:absolute;right:8px;bottom:8px;font:11px var(--mono);background:rgba(0,0,0,.7);padding:2px 7px;border-radius:5px}
.thumb .rec{position:absolute;left:8px;top:8px;font:10px var(--mono);color:var(--g);display:flex;align-items:center;gap:5px}
.thumb .rec::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--g)}
.src .meta{padding:10px 12px;font-size:13.5px}.src .meta span{display:block;font:11px var(--mono);color:var(--muted)}
.tl{padding:10px 12px 12px;border-top:1px solid var(--line)}
.wave{position:relative;height:42px;display:flex;align-items:center;gap:1px}
.wave b{flex:1;background:#2a372d;border-radius:1px}
.seg{position:absolute;top:0;bottom:0;background:rgba(0,255,65,.18);border:1px solid var(--g);border-radius:4px;opacity:0;transition:opacity .4s}
.seg.on{opacity:1}
.seg i{position:absolute;top:-17px;left:0;font:10px var(--mono);font-style:normal;color:var(--g);white-space:nowrap}
.ph{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--lime);box-shadow:0 0 8px var(--lime);left:0;opacity:0}
.tlx{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--muted);margin-top:4px}
.q{display:flex;flex-direction:column;gap:6px}
.qi{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:13px}
.qi span{font:11px var(--mono);color:var(--muted)}
.qi em{grid-row:1/3;grid-column:2;align-self:center;font:11px var(--mono);font-style:normal;color:var(--muted)}
.qi.now{border-color:rgba(0,255,65,.35)}.qi.now em{color:var(--g)}
.qi.done em{color:var(--g)}
.set{display:flex;flex-wrap:wrap;gap:6px}
.set span{font:11px var(--mono);padding:4px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--muted)}
.set span.on{border-color:rgba(0,255,65,.4);color:var(--g)}
.right2{min-height:0;display:flex;flex-direction:column;overflow:hidden}
.pipe{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.st{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--bg);font-size:12.5px;position:relative;overflow:hidden}
.st b{display:block;font:500 10.5px var(--mono);color:var(--muted);margin-bottom:2px}
.st::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:var(--p,0%);background:var(--g);transition:width .3s}
.st.run{border-color:rgba(0,255,65,.35)}.st.run b{color:var(--g)}
.st.ok b{color:var(--g)}.st.ok b::after{content:" ✓"}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.bar .log{font:12px var(--mono);color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .log b{color:var(--g);font-weight:500}
.go{padding:11px 18px;border-radius:12px;background:var(--lime);color:var(--bg);font-weight:700;font-size:14px;white-space:nowrap}
.go:disabled{opacity:.4;cursor:default}
.res{flex:1;overflow:auto;padding:16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-content:start}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 10px;font-size:14px}
.empty span{display:block;font:24px var(--mono);color:var(--line2);margin-bottom:10px}
.clip{display:flex;flex-direction:column;gap:10px;animation:in .45s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.phone{aspect-ratio:9/16;height:min(400px,56vh);align-self:center;max-width:100%;border-radius:18px;border:1px solid var(--line2);overflow:hidden;position:relative;background:#0f1611}
.phone .bgv{position:absolute;inset:0;background:radial-gradient(circle at 50% 38%,var(--c1),transparent 60%),linear-gradient(180deg,#121a14,#0a0e0b)}
.phone .face{position:absolute;left:50%;top:30%;transform:translateX(-50%);width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 40%,#2c3a30,#18211b);border:1px solid var(--line2)}
.phone .body{position:absolute;left:50%;top:52%;transform:translateX(-50%);width:76%;height:40%;border-radius:50% 50% 0 0;background:linear-gradient(#1f2a22,#121a14)}
.phone .hook{position:absolute;left:8%;right:8%;top:7%;font:800 13px/1.15 var(--body);text-transform:uppercase;text-align:center;color:#fff;background:rgba(0,0,0,.55);border-radius:8px;padding:7px 8px}
.phone .hook mark{background:var(--lime);color:#000;padding:0 3px;border-radius:3px}
.phone .sub{position:absolute;left:6%;right:6%;bottom:16%;text-align:center;font:800 14px/1.2 var(--body);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.9)}
.phone .sub span{transition:color .15s}
.phone .sub span.on{color:var(--lime)}
.phone .pf{position:absolute;right:8px;bottom:8px;font:10px var(--mono);background:rgba(0,0,0,.6);padding:2px 6px;border-radius:5px}
.phone .sc{position:absolute;left:8px;bottom:8px;font:600 10px var(--mono);color:var(--bg);background:var(--g);padding:2px 7px;border-radius:5px}
.prog{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.08)}.prog i{display:block;height:100%;background:var(--g);width:0}
.card{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:12px;font-size:13px}
.card .t{font-weight:700;font-size:14px;margin-bottom:4px}
.card .tm{font:11px var(--mono);color:var(--muted);margin-bottom:6px}
.card .d{color:var(--muted)}
.card .h{color:var(--g);font:12px var(--mono);margin-top:6px;word-break:break-word}
.plat{display:flex;gap:6px;margin-top:8px}
.plat span{font:10.5px var(--mono);padding:2px 7px;border:1px solid var(--line2);border-radius:6px;color:var(--muted)}
.cover{display:flex;gap:8px;margin-top:8px}
.cover div{flex:1;aspect-ratio:9/16;border-radius:7px;border:1px solid var(--line2);background:linear-gradient(160deg,var(--c1),#0f1611 70%);display:flex;align-items:flex-end;padding:5px;font:800 8.5px/1.1 var(--body);text-transform:uppercase}
.cover div.pick{border-color:var(--lime);box-shadow:0 0 0 1px var(--lime)}
@media(max-width:1180px){.res{grid-template-columns:repeat(2,minmax(0,1fr))}.pipe{grid-template-columns:repeat(3,1fr)}}
@media(max-width:860px){.app{height:auto;min-height:100vh}.main{grid-template-columns:1fr}.res{grid-template-columns:1fr 1fr}.right2{min-height:80vh}}
@media(max-width:520px){.res{grid-template-columns:1fr}.pipe{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  if(!el){el=document.createElement('div');el.className='clip';el.id=id;$('res').appendChild(el)}
  var phone='<div class="phone" style="--c1:'+c.c+'"><div class="bgv"></div><div class="face"></div><div class="body"></div><div class="prog"><i id="pg'+i+'"></i></div>'+
   (stage>=2?'<div class="hook">'+k.h+'</div>':'')+
   (stage>=1?'<div class="sub" id="sb'+i+'">'+k.sub.map(function(w){return'<span>'+esc(w)+'</span>'}).join(' ')+'</div>':'')+
   '<span class="sc">'+t.score+' '+c.sc+'</span><span class="pf">0:'+c.d+'</span></div>';
  var card=stage>=3?'<div class="card"><div class="tm">'+fmt(c.s)+' - '+fmt(c.s+c.d)+'</div><div class="t">'+esc(k.t)+'</div><div class="d">'+esc(k.d)+'</div><div class="h">'+esc(k.tags)+'</div>'+
   '<div class="cover">'+[0,1,2].map(function(j){return'<div class="'+(j===0?'pick':'')+'" style="--c1:'+c.c+'">'+esc(k.t)+'</div>'}).join('')+'</div><div class="plat"><span>Reels</span><span>Shorts</span><span>TikTok</span></div></div>':
   '<div class="card"><div class="tm">'+fmt(c.s)+' - '+fmt(c.s+c.d)+'</div><div class="d">…</div></div>';
  el.innerHTML=phone+card;}
var kar=null;
function startKaraoke(){clearInterval(kar);var pos=[0,0,0];kar=setInterval(function(){CL.forEach(function(c,i){var sb=$('sb'+i);if(!sb)return;var sp=sb.children;pos[i]=(pos[i]+1)%(sp.length+2);
  [].forEach.call(sp,function(s,j){s.classList.toggle('on',j===pos[i])});var pg=$('pg'+i);if(pg)pg.style.width=(pos[i]/(sp.length+1)*100)+'%'})},380);timers.push(kar)}
$('go').onclick=run;
document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){L=b.dataset.set;try{localStorage.setItem('cv_lang',L)}catch(e){}clearInterval(kar);apply()}});
apply();
